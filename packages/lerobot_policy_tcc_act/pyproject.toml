[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lerobot_policy_tcc_act"
version = "0.1.0"
description = "Official LeRobot ACT with a TCC upstream visual backbone"
requires-python = ">=3.12"
dependencies = ["lerobot==0.6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_policy_tcc_act"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_trossen"
version = "0.1.0"
description = "Minimal WidowX AI follower for LeRobot"
requires-python = ">=3.12,<3.13"
dependencies = ["lerobot[core-scripts]==0.6.0", "trossen_arm==1.9.3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lerobot_robot_trossen"]

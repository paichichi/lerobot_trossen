[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lerobot_policy_v11"
version = "0.1.0"
description = "LeRobot inference adapter for the TCC real-robot V11 policy"
requires-python = ">=3.12"
dependencies = [
  "lerobot==0.6.0",
  "lerobot_policy_backbone_act>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_policy_v11"]

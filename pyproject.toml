[project]
name = "lerobot-trossen"
version = "0.1.0"
description = "Frozen-ViT ACT training"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"

dependencies = [
  "lerobot_policy_backbone_act>=0.1.0",
  "lerobot_robot_trossen>=0.1.0",
  "lerobot_teleoperator_trossen>=0.1.0",
]

[project.optional-dependencies]
# Keep ACT on the exact LeRobot release recorded in uv.lock.
act = [
  "lerobot[training]==0.6.0",
  "torch==2.7.1; sys_platform == 'linux'",
  "torchvision==0.22.1; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.uv.sources]
lerobot_policy_backbone_act = { workspace = true }
lerobot_robot_trossen = { workspace = true }
lerobot_teleoperator_trossen = { workspace = true }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
combine-as-imports = true
